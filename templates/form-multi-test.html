<!DOCTYPE html>
<html lang="en">
    <head>

    </head>
    <body>
        <!-- form to take multiple images and a text field -->
        <form action="/api/chat" method="post" enctype="multipart/form-data">
            <label for="images">JPEG Images:</label>
            <input type="file" name="images" multiple accept=".jpg,.jpeg,.png,.gif">
            <label for="additionalInfo">Additional Info:</label>
            <input type="paragraph" name="additionalInfo">
            <input type="submit" value="Submit">
        </form>
    </body>
</html>

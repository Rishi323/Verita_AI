// Initialize the dashboard
document.addEventListener('DOMContentLoaded', () => {
    switchTab('setup');
    initializeEventListeners();
});

function switchTab(tabName) {
    // Update active tab styling
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-blue-700');
    });
    document.querySelector(`[data-tab="${tabName}"]`).classList.add('bg-blue-700');

    // Update content
    const contentArea = document.getElementById('content-area');
    contentArea.innerHTML = templates[tabName];

    // Initialize charts if needed
    if (tabName === 'monitoring' || tabName === 'results') {
        initializeCharts();
    }
}

function handleFileUpload(event, variantId) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const previewDiv = document.getElementById(`${variantId}-preview`);
            previewDiv.innerHTML = `
                <img src="${e.target.result}" alt="${file.name}" class="image-preview mt-4 max-h-48 mx-auto">
                <p class="mt-2 text-sm text-gray-600">${file.name}</p>
            `;
        };
        reader.readAsDataURL(file);
    }
}

function initializeCharts() {
    const chartConfig = {
        type: 'bar',
        data: {
            labels: ['Variant A', 'Variant B'],
            datasets: [{
                label: 'Conversion Rate (%)',
                data: [15, 18],
                backgroundColor: ['#000', '#000'],
                borderRadius: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    max: 20,
                    ticks: {
                        stepSize: 5
                    },
                    grid: {
                        display: true
                    }
                },
                x: {
                    grid: {
                        display: false
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    };

    const monitoringChart = document.getElementById('monitoringChart');
    const resultsChart = document.getElementById('resultsChart');

    if (monitoringChart) {
        new Chart(monitoringChart, chartConfig);
    }

    if (resultsChart) {
        new Chart(resultsChart, chartConfig);
    }
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verita - Usability Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .loading:after {
            overflow: hidden;
            display: inline-block;
            vertical-align: bottom;
            animation: ellipsis steps(4, end) 900ms infinite;
            content: "\2026";
            width: 0px;
        }
        @keyframes ellipsis {
            to { width: 20px; }
        }
        #vapi-support-btn {
            position: fixed !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            bottom: 20px !important;
            margin: 0 auto !important;
            padding: 12px 24px !important;
            background-color: #2563eb !important;
            color: white !important;
            border-radius: 8px !important;
            font-weight: 500 !important;
            transition: all 0.2s !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
            z-index: 2147483647 !important;
        }
        #vapi-support-btn:hover {
            background-color: #1d4ed8 !important;
            transform: translateX(-50%) translateY(-1px) !important;
            box-shadow: 0 6px 8px -1px rgba(0, 0, 0, 0.1), 0 3px 6px -1px rgba(0, 0, 0, 0.06) !important;
        }
        #vapi-support-btn svg {
            filter: brightness(0) invert(1) !important;
        }
        .vapi-btn {
            position: relative !important;
            align-self: center !important;
            width: fit-content !important;
            margin: 20px auto !important;
        }
    </style>
</head>
<body class="min-h-screen bg-white flex flex-col">
    <header class="w-full py-4 px-4 md:px-6 bg-white border-b">
        <div class="container mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2">
                <div class="font-bold text-2xl bg-gradient-to-r from-blue-600 via-blue-500 to-orange-500 text-transparent bg-clip-text">
                    Verita AI
                </div>
            </a>
            <nav class="hidden md:flex items-center space-x-6">
                <a href="/voice-agent" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2">
                    Try our demo
                </a>
                <a href="/features" class="text-sm font-medium text-gray-600 hover:text-gray-900">
                    Features
                </a>
                <a href="/login" class="text-sm font-medium text-gray-600 hover:text-gray-900">
                    Login
                </a>
            </nav>
            <button class="md:hidden inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 w-10">
                <i data-lucide="menu" class="h-6 w-6"></i>
            </button>
        </div>
    </header>


    <main class="flex-1 container mx-auto px-4 py-8">
        <div id="upload-page" class="max-w-4xl mx-auto">
            <div class="bg-white border border-gray-200 rounded-lg shadow-md">
                <div class="p-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Conduct Usability Test</h2>
                    <form id="dataForm" enctype="multipart/form-data">
                        <div class="space-y-4">
                            <div class="flex border-b border-gray-200">
                                <button type="button" onclick="setActiveTab('images')" id="images-tab" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-800 border-b-2 border-blue-500">Images/Stimuli</button>
                                <button type="button" onclick="setActiveTab('topics')" id="topics-tab" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-800">Topics/Painpoints</button>
                                <button type="button" onclick="setActiveTab('guide')" id="guide-tab" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-800">Discussion Guide</button>
                            </div>

                            <div id="images-content" class="space-y-4">
                                <label class="block text-sm font-medium text-gray-700">Upload Test Images</label>
                                <div class="flex items-center justify-center w-full">
                                    <label for="images" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer hover:border-blue-500 bg-gray-50 hover:bg-gray-100 transition-colors">
                                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                            <i data-lucide="image-plus" class="w-8 h-8 mb-3 text-gray-400"></i>
                                            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                                            <p class="text-xs text-gray-500">PNG, JPG, GIF up to 10MB</p>
                                        </div>
                                        <input id="images" name="images" type="file" class="hidden" multiple accept="image/*" onchange="handleFileUpload(event)">
                                    </label>
                                </div>
                                <div id="image-preview" class="grid grid-cols-2 gap-4"></div>
                            </div>

                            <div id="topics-content" class="space-y-4 hidden">
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label for="additionalInfo" class="block text-sm font-medium text-gray-700">Image/Brand Info:</label>
                                        <textarea id="additionalInfo" name="additionalInfo" rows="4" class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none focus:border-blue-500"></textarea>
                                    </div>
                                    <div>
                                        <label for="additionalQuestions" class="block text-sm font-medium text-gray-700">Additional Questions:</label>
                                        <textarea id="additionalQuestions" name="additionalQuestions" rows="4" class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none focus:border-blue-500"></textarea>
                                    </div>
                                </div>
                            </div>

                            <div id="guide-content" class="space-y-4 hidden">
                                <label for="guide" class="block text-sm font-medium text-gray-700">Upload Discussion Guide</label>
                                <div class="flex items-center justify-center w-full">
                                    <label for="guide" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer hover:border-blue-500 bg-gray-50 hover:bg-gray-100 transition-colors">
                                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                            <i data-lucide="file-text" class="w-8 h-8 mb-3 text-gray-400"></i>
                                            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                                            <p class="text-xs text-gray-500">PDF, DOC, DOCX, TXT up to 10MB</p>
                                        </div>
                                        <input id="guide" name="guide" type="file" class="hidden" accept=".pdf,.doc,.docx,.txt" onchange="handleGuideUpload(event)">
                                    </label>
                                </div>
                                <p id="guide-name" class="mt-2 text-sm text-gray-500"></p>
                            </div>
                        </div>
                        <div class="flex justify-end mt-6">
                            <button type="button" onclick="startInterview()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                                Start Interview
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div id="interview-page" class="max-w-4xl mx-auto space-y-8 hidden">
            <div id="interview-image-preview" class="grid grid-cols-2 gap-4"></div>
            <div id="loadingIndicator" class="text-center text-xl loading" style="display:none">
                Processing (this may take up to 20 seconds)
            </div>
        </div>
    </main>

    <script>
        const assistant = "3a00e93d-5ce5-4046-98c1-8f845ae1f0b4";
        const apiKey = "71d6d017-20a2-49b9-b972-7a81bd3adef4";
        let selectedFiles = [];

        lucide.createIcons();

        function setActiveTab(tabName) {
            ['images', 'topics', 'guide'].forEach(tab => {
                document.getElementById(`${tab}-tab`).classList.remove('border-b-2', 'border-blue-500');
                document.getElementById(`${tab}-content`).classList.add('hidden');
            });
            document.getElementById(`${tabName}-tab`).classList.add('border-b-2', 'border-blue-500');
            document.getElementById(`${tabName}-content`).classList.remove('hidden');
        }

        function handleFileUpload(event) {
            const files = Array.from(event.target.files);
            selectedFiles = files;
            const previewContainer = document.getElementById('image-preview');
            previewContainer.innerHTML = '';
            
            files.forEach((file, index) => {
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const container = document.createElement('div');
                        container.className = 'aspect-video bg-gray-100 rounded-lg overflow-hidden shadow-md';
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.alt = `Test image ${index + 1}`;
                        img.className = 'w-full h-full object-cover';
                        container.appendChild(img);
                        previewContainer.appendChild(container);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        function handleGuideUpload(event) {
            const file = event.target.files[0];
            document.getElementById('guide-name').textContent = file ? `File selected: ${file.name}` : '';
        }

        async function startInterview() {
            if (selectedFiles.length === 0) {
                alert("Please upload at least one image before starting the interview.");
                return;
            }

            document.getElementById('upload-page').classList.add('hidden');
            document.getElementById('interview-page').classList.remove('hidden');
            document.getElementById('loadingIndicator').style.display = 'block';

            const interviewImagePreview = document.getElementById('interview-image-preview');
            interviewImagePreview.innerHTML = document.getElementById('image-preview').innerHTML;

            const formData = new FormData(document.getElementById('dataForm'));
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                if (response.ok && data.response) {
                    activateVapi(data.response);
                } else {
                    console.error('Error in form submission:', data.error || 'Unknown error');
                }
            } catch (error) {
                console.error('Error:', error);
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }

        function activateVapi(assistantOverrides) {
            const buttonConfig = {
                position: "bottom",
                offset: "20px",
                width: "240px",
                height: "56px",
                zIndex: 2147483647,
                idle: {
                    color: "#2563eb",
                    type: "pill",
                    icon: "https://unpkg.com/lucide-static@0.321.0/icons/phone.svg",
                    title: "Interview with our AI assistant!",
                    subtitle: "",
                    iconFilter: "brightness(0) invert(1)"
                },
                loading: {
                    color: "#3b82f6",
                    type: "pill",
                    icon: "https://unpkg.com/lucide-static@0.321.0/icons/loader-2.svg",
                    iconFilter: "brightness(0) invert(1)"
                },
                active: {
                    color: "#1d4ed8",
                    type: "pill",
                    icon: "https://unpkg.com/lucide-static@0.321.0/icons/phone-off.svg",
                    iconFilter: "brightness(0) invert(1)"
                }
            };

            const script = document.createElement("script");
            script.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@1.1.6/dist/assets/index.js";
            script.id = "vapi-script";
            script.defer = true;
            script.async = true;

            script.onload = () => {
                window.vapiSDK.run({
                    apiKey: apiKey,
                    assistant: assistant,
                    assistantOverrides: assistantOverrides,
                    config: buttonConfig,
                });
            };

            document.head.appendChild(script);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Platform Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Left Sidebar -->
        <div class="w-64 bg-white shadow-sm p-6">
            <h1 class="text-xl font-bold mb-8">Research Platform</h1>
            <ul class="space-y-4">
                <li>
                    <a href="#" class="flex items-center text-gray-600 hover:text-gray-900">
                        <i data-lucide="mail" class="w-5 h-5 mr-2"></i>
                        Overview
                    </a>
                </li>
                <li>
                    <button class="flex items-center text-gray-600 hover:text-gray-900 w-full">
                        <i data-lucide="plus" class="w-5 h-5 mr-2"></i>
                        Studies
                    </button>
                </li>
                <li>
                    <a href="/postresearch" class="flex items-center text-gray-600 hover:text-gray-900">
                        <i data-lucide="message-square" class="w-5 h-5 mr-2"></i>
                        Post-Research Interview
                    </a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold">Dashboard Overview</h2>
                <div class="flex gap-4">
                    <button class="px-4 py-2 bg-gray-100 rounded-md text-gray-900 hover:bg-gray-200">
                        New Recording
                    </button>
                    <button class="px-4 py-2 bg-black text-white rounded-md hover:bg-gray-900">
                        New Study
                    </button>
                </div>
            </div>

            <!-- Metrics Grid -->
            <div class="grid grid-cols-4 gap-6">
                <!-- Total Studies -->
                <div class="bg-white rounded-lg p-6 shadow-sm">
                    <h3 class="text-lg font-semibold mb-4">Total Studies</h3>
                    <p class="text-4xl font-bold mb-2">12</p>
                    <p class="text-sm text-gray-500">+2 from last month</p>
                </div>

                <!-- Total Recordings -->
                <div class="bg-white rounded-lg p-6 shadow-sm">
                    <h3 class="text-lg font-semibold mb-4">Total Recordings</h3>
                    <p class="text-4xl font-bold mb-2">142</p>
                    <p class="text-sm text-gray-500">+24 from last month</p>
                </div>

                <!-- AI Interviews -->
                <div class="bg-white rounded-lg p-6 shadow-sm">
                    <h3 class="text-lg font-semibold mb-4">AI Interviews</h3>
                    <p class="text-4xl font-bold mb-2">32</p>
                    <p class="text-sm text-gray-500">+3 from last month</p>
                </div>

                <!-- Stimuli -->
                <div class="bg-white rounded-lg p-6 shadow-sm">
                    <h3 class="text-lg font-semibold mb-4">Stimuli</h3>
                    <p class="text-4xl font-bold mb-2">56</p>
                    <p class="text-sm text-gray-500">+8 from last month</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>

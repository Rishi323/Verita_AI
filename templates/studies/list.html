{% extends "base.html" %}
{% block content %}
<section class="py-20">
    <div class="container mx-auto">
        <h2 class="text-3xl font-bold mb-8">Research Studies</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            {% for study in studies %}
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-semibold mb-4">{{ study.title }}</h3>
                <p class="text-gray-600 mb-4">{{ study.description }}</p>
                <a href="{{ url_for('generate_discussion_guide', study_id=study.id) }}" 
                   class="text-blue-500 font-semibold hover:underline">
                    Generate Guide
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}

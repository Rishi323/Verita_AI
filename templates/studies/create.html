{% extends "base.html" %}
{% block content %}
<section class="py-20">
    <div class="container mx-auto">
        <h2 class="text-3xl font-bold mb-8">Create New Study</h2>
        <form method="POST" class="max-w-2xl mx-auto">
            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Title</label>
                <input type="text" name="title" 
                       class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Description</label>
                <textarea name="description" 
                          class="w-full px-4 py-2 border rounded-lg h-32"></textarea>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Objectives</label>
                <textarea name="objectives" 
                          class="w-full px-4 py-2 border rounded-lg h-32"></textarea>
            </div>
            <button type="submit" 
                    class="bg-blue-500 text-white px-6 py-2 rounded-full">
                Create Study
            </button>
        </form>
    </div>
</section>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Complete - Verita AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/static/js/auth-check.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-blue-50/50 to-rose-50/50">
    <div class="max-w-md w-full space-y-8 p-8 bg-white rounded-xl shadow-lg text-center">
        <h1 class="text-3xl font-bold text-gray-900">You're all set!</h1>
        <p class="text-lg text-gray-600">Start your first project with Verita AI.</p>
        <a href="/" class="inline-block w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Go to Home
        </a>
    </div>

    <script>
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_API_KEY);

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: { user }, error } = await supabase.auth.getUser();
                if (error) throw error;

                // You can add any additional logic here, such as fetching user profile data
                // or sending analytics events for completed onboarding
            } catch (error) {
                console.error('Error:', error.message);
                alert('An error occurred. Please try again.');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals - Verita AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/static/js/auth-check.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-blue-50/50 to-rose-50/50">
    <div class="max-w-md w-full space-y-8 p-8 bg-white rounded-xl shadow-lg">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-900">What Do You Want to Achieve with Verita AI?</h1>
            <p class="mt-2 text-sm text-gray-600">Select all that apply.</p>
        </div>
        <form id="goalsForm" class="space-y-4">
            <div class="space-y-4">
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="conductResearch" name="goals" value="Conduct UX research" class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded">
                    <label for="conductResearch" class="block text-sm font-medium text-gray-700">Conduct UX research</label>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="analyzeFeedback" name="goals" value="Analyze user feedback" class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded">
                    <label for="analyzeFeedback" class="block text-sm font-medium text-gray-700">Analyze user feedback</label>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="createPersonas" name="goals" value="Create user personas" class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded">
                    <label for="createPersonas" class="block text-sm font-medium text-gray-700">Create user personas</label>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="other" name="goals" value="Other" class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded">
                    <label for="other" class="block text-sm font-medium text-gray-700">Other</label>
                </div>
            </div>
            <div id="otherGoalContainer" class="hidden space-y-2">
                <label for="otherGoal" class="block text-sm font-medium text-gray-700">Please specify:</label>
                <input type="text" id="otherGoal" name="otherGoal" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
            </div>
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Finish
            </button>
        </form>
    </div>

    <script>
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_API_KEY);

        document.getElementById('other').addEventListener('change', function() {
            document.getElementById('otherGoalContainer').style.display = this.checked ? 'block' : 'none';
        });

        document.getElementById('goalsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const goals = formData.getAll('goals');
            const otherGoal = formData.get('otherGoal');
            
            if (goals.includes('Other')) {
                goals[goals.indexOf('Other')] = otherGoal;
            }
            
            try {
                const { data: { user }, error } = await supabase.auth.getUser();
                if (error) throw error;

                const { data, error: updateError } = await supabase
                    .from('user_profiles')
                    .upsert({ user_id: user.id, goals: goals });

                if (updateError) throw updateError;

                window.location.href = 'templates/onboarding/complete.html';
            } catch (error) {
                console.error('Error:', error.message);
                alert('An error occurred. Please try again.');
            }
        });
    </script>
</body>
</html>

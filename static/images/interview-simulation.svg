<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="300" height="300" fill="#F8FAFC"/>
    
    <!-- AI Circle -->
    <circle cx="150" cy="150" r="100" fill="#4869E9" fill-opacity="0.1"/>
    
    <!-- Person Icon Left -->
    <circle cx="100" cy="120" r="25" fill="#4869E9"/>
    <rect x="75" y="155" width="50" height="60" rx="25" fill="#4869E9"/>
    
    <!-- Person Icon Right -->
    <circle cx="200" cy="120" r="25" fill="#4869E9" fill-opacity="0.6"/>
    <rect x="175" y="155" width="50" height="60" rx="25" fill="#4869E9" fill-opacity="0.6"/>
    
    <!-- Connection Lines -->
    <path d="M120 140 L180 140" stroke="#4869E9" stroke-width="3" stroke-dasharray="5,5"/>
    <path d="M120 160 L180 160" stroke="#4869E9" stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- AI Nodes -->
    <circle cx="150" cy="100" r="8" fill="#FF9F43"/>
    <circle cx="130" cy="180" r="8" fill="#FF9F43"/>
    <circle cx="170" cy="180" r="8" fill="#FF9F43"/>
    
    <!-- Connecting Lines -->
    <path d="M150 100 L130 180" stroke="#FF9F43" stroke-width="2"/>
    <path d="M150 100 L170 180" stroke="#FF9F43" stroke-width="2"/>
</svg>
